# Backing services for local development, bound to localhost only:
#   docker compose -f deploy/compose/dev.yml up -d
# Postgres (users, logins, model records, the training queue) on :5433. The credentials
# are for this machine only. Object storage needs no service locally: OBJECT_STORE_URL
# defaults to a directory (file://), and production points it at S3.
name: pixel-map-lab
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16.4-alpine
    environment:
      POSTGRES_USER: pml
      POSTGRES_PASSWORD: pml-dev
      POSTGRES_DB: pml
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pml"]
      interval: 2s
      retries: 30
volumes:
  postgres: {}
