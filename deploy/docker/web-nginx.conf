server {
  listen 8080;
  root /usr/share/nginx/html;

  # File names are not content-hashed, so clients revalidate instead of caching blindly.
  add_header Cache-Control "no-cache";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
