# Authoritative game rooms. Stateful (rooms live in memory), so it is NOT autoscaled by an HPA:
# scaling down would kill live games. It runs as ONE replica for now: a room exists only in the
# pod that created it, and nothing yet routes a joining player to that pod. Phase 5 replaces
# this Deployment with an Agones Fleet, which allocates rooms to servers, routes players to the
# right one, and only removes servers with no live rooms.
#
# Node runs the simulation on one thread, so one core is its ceiling: request a whole core and
# set no CPU limit, because CFS throttling would stall the 20 Hz tick. On SIGTERM the server
# stops taking rooms (readiness fails) and the long grace period lets live rooms finish.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: room-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: room-server
    spec:
      terminationGracePeriodSeconds: 3600
      securityContext:
        runAsNonRoot: true
      containers:
        - name: room-server
          image: pml/room-server
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_URL # the autopilot; rooms work without it
              value: http://agent-inference
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: room-server
spec:
  selector:
    app.kubernetes.io/name: room-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: room-server
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: room-server
