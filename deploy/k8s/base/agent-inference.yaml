# Guard-agent decisions for rooms whose players hand control to their agent (about 2 ms a
# decision on CPU), and live fine-tuning of each player's own agent. Checkpoints, plans and
# their sight caches are baked into the image.
#
# Players' tuned agents live in this process, so every request for a player must reach the
# same pod: ONE replica, no autoscaler, until phase 5 routes players to a consistent replica
# (and moves training into its own service). Memory allows MAX_TUNED_MODELS tuned agents of
# about 56 MB each on top of the pretrained models.
# The CPU limit doubles as the thread count: numba and torch would otherwise size their pools
# from the node's cores and be throttled. The limit is passed in through the downward API
# (rounded up to whole cores).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-inference
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: agent-inference
          image: pml/agent-inference
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: DATABASE_URL }
            - name: OBJECT_STORE_URL
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: OBJECT_STORE_URL }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: AWS_ACCESS_KEY_ID, optional: true }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: AWS_SECRET_ACCESS_KEY, optional: true }
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: S3_ENDPOINT_URL, optional: true }
            - name: MAX_TUNED_MODELS
              value: "32"
            - name: NUMBA_NUM_THREADS
              valueFrom:
                resourceFieldRef: { resource: limits.cpu, divisor: "1" }
            - name: OMP_NUM_THREADS
              valueFrom:
                resourceFieldRef: { resource: limits.cpu, divisor: "1" }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { cpu: "2", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: agent-inference
spec:
  selector:
    app.kubernetes.io/name: agent-inference
  ports:
    - name: http
      port: 80
      targetPort: http
