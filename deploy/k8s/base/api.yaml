# Sign-in (GitHub OAuth) and accounts. Stateless (Postgres holds users and logins): scale on CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: pml/api
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: DATABASE_URL }
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: GITHUB_CLIENT_ID, optional: true }
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: pml-secrets, key: GITHUB_CLIENT_SECRET, optional: true }
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef: { name: pml-config, key: PUBLIC_URL }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
