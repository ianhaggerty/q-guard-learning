# Production: each workload on its node pool. Nodes carry the label pixel-map-lab/pool, and the
# realtime and batch pools are tainted so nothing else lands there:
#   realtime  on-demand nodes, room servers only (never preempted mid-game)
#   general   web, api, agent inference
#   batch     spot nodes scaled to zero; trainer workers (KEDA) and one-off jobs (../../jobs/)
# CI sets image tags: kustomize edit set image pml/web=<registry>/pml/web:<sha> ...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pml
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: { kind: Deployment, name: room-server }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { pixel-map-lab/pool: realtime }
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: pixel-map-lab/pool, operator: Equal, value: realtime, effect: NoSchedule }
  - target: { kind: Deployment, name: trainer }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { pixel-map-lab/pool: batch }
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: pixel-map-lab/pool, operator: Equal, value: batch, effect: NoSchedule }
  - target: { kind: Deployment, name: "web|api|agent-inference" }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { pixel-map-lab/pool: general }
  - target: { kind: Ingress, name: pixel-map-lab }
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: pixel-map-lab.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts: [pixel-map-lab.example.com]
            secretName: pixel-map-lab-tls
