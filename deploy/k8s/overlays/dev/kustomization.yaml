# Local cluster (kind): one replica of everything, small requests, locally loaded images, an
# in-cluster Postgres, a shared volume for object storage, development sign-in, and a single
# trainer worker instead of KEDA's autoscaling.
#   docker build ... -t pml/<name>:dev && kind load docker-image pml/<name>:dev
#   kubectl apply -k deploy/k8s/overlays/dev
#   kubectl create -n pml-dev -f deploy/k8s/jobs/migrate-job.yaml   (with image pml/api:dev)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pml-dev
resources:
  - namespace.yaml
  - postgres.yaml
  - ../../base
secretGenerator:
  - name: pml-secrets
    literals:
      - DATABASE_URL=postgres://pml:pml-dev@postgres:5432/pml
      - OBJECT_STORE_URL=file:///data/objects
configMapGenerator:
  - name: pml-config
    literals:
      - PUBLIC_URL=http://localhost:8080
images:
  - { name: pml/web, newTag: dev }
  - { name: pml/api, newTag: dev }
  - { name: pml/room-server, newTag: dev }
  - { name: pml/agent-inference, newTag: dev }
  - { name: pml/trainer, newTag: dev }
replicas:
  - { name: web, count: 1 }
  - { name: api, count: 1 }
  - { name: room-server, count: 1 }
  - { name: agent-inference, count: 1 }
  - { name: trainer, count: 1 }
patches:
  - target: { kind: ScaledObject, name: trainer }
    patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: trainer
  - target: { kind: TriggerAuthentication, name: trainer-database }
    patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: TriggerAuthentication
      metadata:
        name: trainer-database
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DEV_LOGIN, value: "1" }
  - target: { kind: Deployment, name: "agent-inference|trainer" }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value: [{ name: objects, persistentVolumeClaim: { claimName: objects } }]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{ name: objects, mountPath: /data/objects }]
  - target: { kind: Deployment, name: trainer }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: "1", memory: 1Gi }
          limits: { cpu: "2", memory: 3Gi }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: Deployment, name: room-server }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
  - target: { kind: Deployment, name: agent-inference }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: "1", memory: 1Gi }
          limits: { cpu: "1", memory: 2Gi }
