[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pml-trainer"
version = "0.1.0"
description = "Fine-tuning job entry point for guard agents"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["guardrl"]

[tool.setuptools]
packages = ["trainer"]
